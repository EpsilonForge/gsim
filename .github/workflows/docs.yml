name: Docs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PLOTLY_RENDERER: notebook_connected
  PYVISTA_JUPYTER_BACKEND: static
  PYVISTA_OFF_SCREEN: "true"
jobs:
  discover-notebooks:
    name: Discover docs notebooks
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.notebooks.outputs.notebooks }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install UV
      uses: astral-sh/setup-uv@v6
    - name: List published notebooks
      id: notebooks
      run: echo "notebooks=$(uv run python scripts/list_docs_notebooks.py --json)" >> "$GITHUB_OUTPUT"
  execute-notebooks:
    name: Execute ${{ matrix.notebook }}
    needs: discover-notebooks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        notebook: ${{ fromJSON(needs.discover-notebooks.outputs.notebooks) }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install system dependencies
      run: >-
        sudo apt-get update && sudo apt-get install -y libglu1-mesa libegl1 libgl1 libosmesa6 libxrender1 libxcursor1 libxft2 libxinerama1 xvfb
    - name: Install UV
      uses: astral-sh/setup-uv@v6
    - name: Create environment
      env:
        NOTEBOOK: ${{ matrix.notebook }}
      run: |
        uv sync --locked --no-default-groups --group docs
        case "$NOTEBOOK" in
          nbs/meep_ybranch.ipynb|nbs/meep_ring_coupler.ipynb|nbs/meep_dc.ipynb|nbs/meep_crossing.ipynb)
            uv pip install ubcpdk==3.3.4
            ;;
          nbs/palace_qpdk_resonator.ipynb)
            uv pip install qpdk==0.3.8
            ;;
          nbs/palace_inductor.ipynb)
            uv pip install ihp-gdsfactory==0.2.8 circulax==0.2.3
            ;;
          nbs/palace_*.ipynb)
            uv pip install ihp-gdsfactory==0.2.8
            ;;
        esac
        uv pip check
        uv run --no-sync python -m ipykernel install --user --name gsim --display-name gsim
    - name: Execute notebook
      env:
        GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
        NOTEBOOK: ${{ matrix.notebook }}
      run: uv run --no-sync papermill "$NOTEBOOK" "$NOTEBOOK" -k gsim
    - name: Strip absolute paths
      env:
        NOTEBOOK: ${{ matrix.notebook }}
      run: uv run --no-sync python scripts/strip_notebook_paths.py "$NOTEBOOK"
    - name: Convert notebook to Markdown
      env:
        NOTEBOOK: ${{ matrix.notebook }}
      run: |
        mkdir -p generated-docs
        uv run --no-sync jupyter nbconvert --to markdown --embed-images "$NOTEBOOK" --output-dir generated-docs
    - name: Upload generated docs
      uses: actions/upload-artifact@v4
      with:
        name: notebook-docs-${{ strategy.job-index }}
        path: generated-docs
        retention-days: 1
  build:
    name: Build docs
    needs: execute-notebooks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libosmesa6 xvfb
    - name: Install UV
      uses: astral-sh/setup-uv@v6
    - name: Install Just
      uses: taiki-e/install-action@just
    - name: Install svgbob
      run: cargo install svgbob_cli
    - name: Create environment
      run: uv sync --dev
    - name: Download generated docs
      uses: actions/download-artifact@v4
      with:
        pattern: notebook-docs-*
        path: docs/nbs
        merge-multiple: true
    - name: Build docs
      run: just docs
    - name: Upload Pages artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/site
  pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
