<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gsim — PDK validation results</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  :root { color-scheme: light dark; --fg:#1f2328; --muted:#656d76; --bg:#fff; --card:#f6f8fa; --line:#d0d7de; --accent:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#8b949e; --bg:#0d1117; --card:#161b22; --line:#30363d; --accent:#4493f8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--fg); background:var(--bg); }
  header, main { max-width: 980px; margin: 0 auto; padding: 0 24px; }
  header { padding-top: 40px; padding-bottom: 8px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 1.05rem; margin: 28px 0 10px; }
  .muted { color: var(--muted); }
  .back { font-size: .85rem; text-decoration: none; color: var(--accent); }
  main { padding-bottom: 56px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:20px 0 8px; }
  select { font: inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .plot { width:100%; height:420px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  code { font-size:.85em; }
</style>
</head>
<body>
<header>
  <a class="back" href="../">← all variants</a>
  <h1>PDK FDTD validation</h1>
  <p class="muted">Meep vs PDK reference data — branch <code>pdk-validation</code> (PR #406). S-parameters are de-embedded to the port reference planes.</p>
</header>
<main>
  <div class="controls">
    <label>Case <select id="case"></select></label>
    <span id="meta" class="muted"></span>
  </div>
  <div id="plot" class="plot"></div>

  <h2>Cases</h2>
  <table id="cases">
    <thead>
      <tr>
        <th>Case</th><th>Status</th><th>Mesh</th><th>Freq points</th>
        <th>Cell (λ²)</th><th>Wall time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="muted" id="note"></p>
</main>
<script>
const state = { manifest: null };
const el = (id) => document.getElementById(id);
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
const formatWallTime = (seconds) => {
  if (seconds === null || seconds === undefined) return "—";
  if (seconds < 60) return `${seconds.toFixed(0)} s`;
  if (seconds < 3600) return `${(seconds / 60).toFixed(1)} min`;
  return `${(seconds / 3600).toFixed(2)} h`;
};
const parseCsv = (text) => {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(",").map((s) => s.trim());
  return lines.slice(1).filter(Boolean).map((line) => {
    const values = line.split(",");
    const row = {};
    header.forEach((key, index) => {
      const value = Number(values[index]);
      row[key] = Number.isFinite(value) ? value : values[index];
    });
    return row;
  });
};

async function loadCase(id) {
  const entry = (state.manifest.cases || []).find((c) => c.id === id);
  if (!entry || !entry.file) return;
  el("meta").textContent = [
    entry.dimension,
    entry.resolution ? `res ${entry.resolution}` : "",
    entry.num_freqs ? `${entry.num_freqs} freq` : "",
    entry.note || "",
  ].filter(Boolean).join(" · ");

  if (entry.status !== "complete") {
    Plotly.purge("plot");
    el("plot").innerHTML = `<p class="muted" style="padding:18px">${escapeHtml(entry.title)} is ${escapeHtml(entry.status)}.</p>`;
    return;
  }

  const text = await fetch(`data/${entry.file}`, { cache: "no-store" }).then((r) => r.text());
  const rows = parseCsv(text);
  const wavelength = rows.map((row) => row.wavelength);
  const traces = Object.keys(rows[0] || {})
    .filter((key) => key.endsWith("_mag"))
    .map((key) => ({
      x: wavelength,
      y: rows.map((row) => 20 * Math.log10(Math.max(Number(row[key]), 1e-12))),
      type: "scatter",
      mode: "lines",
      name: key.replace("_mag", ""),
    }));
  Plotly.react("plot", traces, {
    margin: { t: 16, r: 16 },
    xaxis: { title: "wavelength (µm)" },
    yaxis: { title: "|S| (dB)" },
    legend: { orientation: "h" },
    hovermode: "x unified",
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: getComputedStyle(document.body).color },
  }, { responsive: true });
}

async function main() {
  const manifest = await fetch("data/manifest.json", { cache: "no-store" }).then((r) => r.json());
  state.manifest = manifest;
  const cases = manifest.cases || [];

  el("case").innerHTML = cases
    .map((c) => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.title)}</option>`)
    .join("");
  el("cases").querySelector("tbody").innerHTML = cases.map((c) => `
    <tr>
      <td>${escapeHtml(c.title)}</td>
      <td>${escapeHtml(c.status)}</td>
      <td>${escapeHtml(c.dimension || "")}${c.resolution ? " · res " + c.resolution : ""}</td>
      <td>${c.num_freqs ?? ""}</td>
      <td>${c.size_lambda2 ?? ""}</td>
      <td>${formatWallTime(c.wall_time_s)}</td>
    </tr>`).join("");
  el("note").textContent = manifest.note || "";

  el("case").addEventListener("change", (event) => loadCase(event.target.value));
  if (cases.length) await loadCase(cases[0].id);
}

main().catch((error) => {
  el("plot").innerHTML = `<p class="muted" style="padding:18px">Failed to load results: ${escapeHtml(error.message)}</p>`;
});
</script>
</body>
</html>
